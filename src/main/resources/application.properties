spring.application.name=portalSolicitacaoInterna
# Configurações do banco de dados Oracle
spring.datasource.url=jdbc:oracle:thin:@//localhost:1522/xepdb1
spring.datasource.username=portalsolicitacao
spring.datasource.password=portal123
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.show-sql=true
# Configurações adicionais do Hibernate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.jdbc.fetch_size=50


logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Faz o Flyway falhar quando uma migration nao segue o padrao V1__descricao.sql
spring.flyway.validate-migration-naming=true
